<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparador de Telefonía</title>
<style>
:root{
  --navy:#0B2E5C; --blue:#1F6FEB; --blue2:#4b90f7; --green:#1B7F4B; --greenbg:#E4F4EC;
  --ink:#12233d; --muted:#5a6b82; --line:#e2e8f2; --bg:#f4f7fb; --card:#ffffff; --amber:#b7791f;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
header{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:26px 0 22px;
  box-shadow:0 2px 18px rgba(11,46,92,.18)}
header .wrap{padding-bottom:0}
h1{margin:0;font-size:26px;letter-spacing:.2px}
.sub{opacity:.85;font-size:13px;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 8px;
  margin-top:-26px;box-shadow:0 8px 30px rgba(18,35,61,.08);position:relative;z-index:2}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field select,.field input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
.chipgroup{margin:14px 0 2px}
.glabel{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.chip.tipo.on{background:var(--blue);border-color:var(--blue)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;
  cursor:pointer;font-weight:600;color:var(--muted);transition:.15s;user-select:none}
.chip:hover{border-color:var(--blue2)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:16px 0 4px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:22px;font-weight:800;margin-top:3px;color:var(--navy)}
.stat.good .v{color:var(--green)}
.count{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  display:flex;flex-direction:column;gap:9px;transition:.15s;position:relative;overflow:hidden}
.card:hover{box-shadow:0 8px 24px rgba(18,35,61,.10);transform:translateY(-2px)}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co{font-weight:800;font-size:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#eef2f8;color:var(--muted)}
.badge.seg-empresa{background:#FDEBD0;color:#8a5a12}
.badge.seg-particular{background:var(--greenbg);color:var(--green)}
.name{font-size:15px;font-weight:700;line-height:1.3}
.specs{display:flex;flex-wrap:wrap;gap:7px;font-size:12.5px;color:var(--muted)}
.specs span{background:#f5f8fc;border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.priceRow{display:flex;align-items:baseline;justify-content:space-between;margin-top:2px;gap:8px;flex-wrap:wrap}
.price{font-size:24px;font-weight:800;color:var(--navy)}
.price small{font-size:13px;font-weight:600;color:var(--muted)}
.orig{font-size:12px;color:var(--muted)}
.save{font-size:13px;font-weight:800;color:var(--green);background:var(--greenbg);padding:4px 9px;border-radius:8px}
.save.neg{color:#a23;background:#fdeaea}
.promo{font-size:12.5px;color:var(--amber);font-weight:600}
.notes{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px}
.foot{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:16px}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:520px){.price{font-size:21px}h1{font-size:22px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>📶 Comparador de Telefonía</h1>
  <div class="sub" id="sub"></div>
</div></header>

<div class="wrap">
  <div class="panel">
    <div class="controls">
      <div class="field"><label>Segmento</label>
        <select id="fSeg"><option value="particular">Particular</option><option value="empresa">Empresa / Autónomo</option></select></div>
      <div class="field"><label>Líneas móviles (mín.)</label>
        <select id="fLineas"><option value="0">Indiferente</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="5">5+</option></select></div>
      <div class="field"><label>Precio actual del cliente (€/mes)</label>
        <input id="fActual" type="number" min="0" step="0.01" placeholder="Ej. 45"></div>
      <div class="field"><label>Buscar</label>
        <input id="fQ" type="text" placeholder="compañía, tarifa, GB…"></div>
      <div class="field"><label>Ordenar por</label>
        <select id="fSort"><option value="precio">Precio (menor primero)</option><option value="ahorro">Ahorro (mayor primero)</option><option value="datos">Datos (más GB)</option></select></div>
    </div>
    <div class="chipgroup"><span class="glabel">Tipo de servicio</span><div class="chips" id="tipochips"></div></div>
    <div class="chipgroup"><span class="glabel">Compañías</span><div class="chips" id="chips"></div></div>
    <div class="toolbar">
      <label class="toggle"><input type="checkbox" id="tIva" checked> Comparar precios con IVA (normaliza empresa ×1,21)</label>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="count" id="count"></div>
  <div class="cards" id="cards"></div>

  <div class="foot" id="foot"></div>
</div>

const T = DATA.tarifas;
const COMPCOL = {Movistar:'#0033A0',Vodafone:'#E60000',Orange:'#FF7900',Yoigo:'#E6007E',Lowi:'#6C2C91',Finetwork:'#00A19A',MasMovil:'#F49B00',O2:'#0019A5',Jazztel:'#ED1C24'};
const TIPO_LABEL={movil:'Móvil',fibra:'Fibra',convergente:'Fibra+Móvil',tv:'TV/Fútbol',fijo:'Fijo',complemento:'Complemento',adicional:'Línea adic.'};
const PRIMARY=['movil','fibra','convergente','tv','fijo'];
const TIPOS=[{k:'convergente',l:'Fibra + Móvil'},{k:'fibra',l:'Solo Fibra'},{k:'movil',l:'Solo Móvil'},{k:'tv',l:'TV / Fútbol'},{k:'fijo',l:'Fijo'},{k:'complemento',l:'Complementos'}];
let activeTipos=new Set();
document.getElementById('sub').textContent = DATA.meta.vigencia + '  ·  ' + T.length + ' tarifas de ' + [...new Set(T.map(t=>t.compania))].length + ' compañías';

let activeCompanies = new Set();
const companies = [...new Set(T.map(t=>t.compania))].sort();

function gbNum(s){ if(!s) return 0; if(/ilimit|infinit|∞/i.test(s)) return 99999; const m=(''+s).match(/(\d+)/g); return m?Math.max(...m.map(Number)):0; }
function priceIva(t, useIva){ if(!useIva) return t.precio; return t.iva_incluido ? t.precio : Math.round(t.precio*1.21*100)/100; }
function eur(n){ return n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function eur0(n){ return Math.round(n).toLocaleString('es-ES')+' €'; }

function buildTipoChips(){
  const box=document.getElementById('tipochips'); box.innerHTML='';
  const all=document.createElement('div'); all.className='chip tipo on'; all.textContent='Todos los planes'; all.dataset.k='__all';
  all.onclick=()=>{activeTipos.clear();render();}; box.appendChild(all);
  TIPOS.forEach(o=>{
    const el=document.createElement('div'); el.className='chip tipo'; el.textContent=o.l; el.dataset.k=o.k;
    el.onclick=()=>{ activeTipos.has(o.k)?activeTipos.delete(o.k):activeTipos.add(o.k); render(); };
    box.appendChild(el);
  });
}

function buildChips(){
  const box=document.getElementById('chips'); box.innerHTML='';
  const all=document.createElement('div'); all.className='chip on'; all.textContent='Todas'; all.dataset.k='__all';
  all.onclick=()=>{activeCompanies.clear();render();}; box.appendChild(all);
  companies.forEach(c=>{
    const el=document.createElement('div'); el.className='chip'; el.textContent=c; el.dataset.k=c;
    el.onclick=()=>{ activeCompanies.has(c)?activeCompanies.delete(c):activeCompanies.add(c); render(); };
    box.appendChild(el);
  });
}

function render(){
  const seg=document.getElementById('fSeg').value;
  const minL=+document.getElementById('fLineas').value;
  const actual=parseFloat(document.getElementById('fActual').value);
  const q=document.getElementById('fQ').value.trim().toLowerCase();
  const sort=document.getElementById('fSort').value;
  const useIva=document.getElementById('tIva').checked;

  document.querySelectorAll('#chips .chip').forEach(c=>{
    if(c.dataset.k==='__all') c.classList.toggle('on', activeCompanies.size===0);
    else c.classList.toggle('on', activeCompanies.has(c.dataset.k));
  });
  document.querySelectorAll('#tipochips .chip').forEach(c=>{
    if(c.dataset.k==='__all') c.classList.toggle('on', activeTipos.size===0);
    else c.classList.toggle('on', activeTipos.has(c.dataset.k));
  });

  let rows = T.filter(t=>t.segmento===seg)
    .filter(t=> activeTipos.size? activeTipos.has(t.tipo) : PRIMARY.includes(t.tipo))
    .filter(t=> (t.lineas_moviles||0) >= minL)
    .filter(t=> activeCompanies.size? activeCompanies.has(t.compania): true)
    .filter(t=> !q || (t.compania+' '+t.nombre+' '+(t.datos_gb||'')+' '+(t.velocidad_fibra||'')+' '+(t.promo||'')+' '+(t.notas||'')).toLowerCase().includes(q));

  rows = rows.map(t=>({...t, _p:priceIva(t,useIva), _gb:gbNum(t.datos_gb)}));
  rows.forEach(t=> t._save = (!isNaN(actual)? actual - t._p : null));

  if(sort==='precio') rows.sort((a,b)=>a._p-b._p);
  else if(sort==='ahorro') rows.sort((a,b)=>(b._save??-1e9)-(a._save??-1e9)|| a._p-b._p);
  else rows.sort((a,b)=>b._gb-a._gb || a._p-b._p);

  // stats
  const stats=document.getElementById('stats');
  if(rows.length){
    const best=rows.reduce((m,t)=>t._p<m._p?t:m,rows[0]);
    let html = `<div class="stat"><div class="k">Ofertas encontradas</div><div class="v">${rows.length}</div></div>`;
    html += `<div class="stat good"><div class="k">Más barata ${useIva?'(c/IVA)':''}</div><div class="v">${eur(best._p)}<small style="font-size:12px;font-weight:600;color:#5a6b82"> /mes</small></div></div>`;
    html += `<div class="stat"><div class="k">Compañía más barata</div><div class="v" style="color:${COMPCOL[best.compania]||'#0B2E5C'}">${best.compania}</div></div>`;
    if(!isNaN(actual)){
      const cheaper=rows.filter(t=>t._save>0);
      const maxSave=cheaper.length?Math.max(...cheaper.map(t=>t._save)):0;
      html += `<div class="stat good"><div class="k">Ahorro máx. vs ${eur(actual)}</div><div class="v">${maxSave>0?('−'+eur(maxSave)+' /mes'):'—'}</div></div>`;
    }
    stats.innerHTML=html;
  } else stats.innerHTML='';

  document.getElementById('count').textContent = rows.length? `${rows.length} tarifa(s) — ordenadas por ${sort==='precio'?'precio':sort==='ahorro'?'ahorro':'datos'}` : '';

  const box=document.getElementById('cards');
  if(!rows.length){ box.innerHTML='<div class="empty">No hay tarifas con estos filtros. Prueba a ampliar el tipo de servicio o quitar filtros de compañía.</div>'; return; }
  box.innerHTML = rows.map(t=>{
    const col=COMPCOL[t.compania]||'#0B2E5C';
    const specs=[];
    if(t.velocidad_fibra) specs.push('🛜 '+t.velocidad_fibra);
    if(t.datos_gb) specs.push('📱 '+t.datos_gb);
    if(t.lineas_moviles) specs.push('👤 '+t.lineas_moviles+' líne'+(t.lineas_moviles>1?'as':'a'));
    if(t.permanencia_meses) specs.push('🔒 '+t.permanencia_meses+' m'); else specs.push('🔓 sin perm.');
    let saveHtml='';
    if(t._save!==null){
      if(t._save>0.001) saveHtml=`<span class="save">Ahorra ${eur(t._save)}/mes · ${eur0(t._save*12)}/año</span>`;
      else saveHtml=`<span class="save neg">+${eur(Math.abs(t._save))}/mes</span>`;
    }
    return `<div class="card">
      <div class="bar" style="background:${col}"></div>
      <div class="top">
        <span class="co" style="color:${col}">${t.compania}</span>
        <div class="badges">
          <span class="badge">${TIPO_LABEL[t.tipo]||t.tipo}</span>
          <span class="badge seg-${t.segmento}">${t.segmento}</span>
        </div>
      </div>
      <div class="name">${t.nombre}</div>
      <div class="specs">${specs.map(s=>'<span>'+s+'</span>').join('')}</div>
      <div class="priceRow">
        <div><span class="price">${eur(t._p)}</span> <small>/mes</small>
          ${(useIva&&!t.iva_incluido)?`<div class="orig">${eur(t.precio)} sin IVA</div>`:''}
        </div>
        ${saveHtml}
      </div>
      ${t.promo?`<div class="promo">🎁 ${t.promo}</div>`:''}
      ${t.notas?`<div class="notes">${t.notas}</div>`:''}
    </div>`;
  }).join('');
}

['fSeg','fLineas','fActual','fQ','fSort','tIva'].forEach(id=>{
  document.getElementById(id).addEventListener('input',render);
});
